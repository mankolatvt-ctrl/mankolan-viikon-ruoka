<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1345">
<meta http-equiv="refresh" content="900">
<title>Mankolan koulun ruokalista</title>
<style type="text/css">
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background-color:#e7e0cf;
    font-family:"Segoe UI", Arial, Helvetica, sans-serif; color:#1f3a2e; }
  #stage { position:absolute; top:0; left:0; width:1345px; height:980px; background-color:#f7f3ea;
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; overflow:hidden; }
  .head { -webkit-box-flex:0; -webkit-flex:0 0 auto; flex:0 0 auto; height:140px; padding:0 56px;
    border-bottom:3px solid #1f3a2e; display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-align:center; -webkit-align-items:center; align-items:center;
    -webkit-box-pack:justify; -webkit-justify-content:space-between; justify-content:space-between; }
  .head h1 { font-family:Georgia, "Times New Roman", serif; font-weight:bold; font-size:58px; margin:0; }
  .head .sub { font-size:22px; color:#4d6157; margin-top:6px; }
  .week { text-align:right; }
  .week .wk { font-family:Georgia, "Times New Roman", serif; font-weight:bold; font-size:44px; line-height:1.1; }
  .week .range { font-size:22px; color:#4d6157; margin-top:4px; }
  #rows { -webkit-box-flex:1; -webkit-flex:1; flex:1; min-height:0; padding:22px 56px 8px;
    display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; }
  .row { -webkit-box-flex:1; -webkit-flex:1 1 0px; flex:1 1 0px; min-height:0; margin-bottom:10px; overflow:hidden;
    background-color:#fffdf7; border:1px solid #d9d2c1; border-left:10px solid #d9d2c1; border-radius:14px;
    padding:0 34px 0 28px; display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-box-align:center; -webkit-align-items:center; align-items:center; }
  .row:last-child { margin-bottom:0; }
  .day { width:250px; margin-right:34px; -webkit-box-flex:0; -webkit-flex:0 0 auto; flex:0 0 auto; }
  .dname { font-family:Georgia, "Times New Roman", serif; font-weight:bold; font-size:40px; line-height:1.1; }
  .ddate { font-size:22px; color:#4d6157; margin-top:4px; }
  .pill { display:none; margin-top:8px; background-color:#d98e3d; color:#fff; font-size:15px; font-weight:bold;
    letter-spacing:1px; padding:3px 12px; border-radius:999px; }
  .food { -webkit-box-flex:1; -webkit-flex:1; flex:1; max-height:112px; overflow:hidden; padding-left:34px;
    border-left:2px solid #e3dccb; line-height:1.22; }
  .f1 { font-size:38px; } .f2 { font-size:32px; } .f3 { font-size:27px; } .f4 { font-size:23px; }
  .food.none { color:#8a9a90; font-style:italic; }
  .row.today { background-color:#1f3a2e; border-color:#1f3a2e; border-left-color:#d98e3d; color:#f7f3ea; }
  .row.today .ddate { color:#cfe0d2; }
  .row.today .food { border-left-color:#3d5a4b; }
  .row.today .pill { display:inline-block; }
  .row.past { background-color:#f2eee3; border-left-color:#e3dccb; color:#76887d; }
  .row.past .ddate { color:#93a299; }
  .foot { -webkit-box-flex:0; -webkit-flex:0 0 auto; flex:0 0 auto; height:42px; padding-top:6px; text-align:center;
    font-size:17px; color:#4d6157; }
  #err { color:#b3261e; font-weight:bold; }
</style>
</head>
<body>
<div id="stage">
  <div class="head">
    <div><h1>Ruokalista</h1><div class="sub">Mankolan koulu</div></div>
    <div class="week"><div class="wk" id="wk">Viikko</div><div class="range" id="range">&nbsp;</div></div>
  </div>
  <div id="rows"></div>
  <div class="foot"><span id="upd">Haetaan ruokalistaa...</span> &nbsp;·&nbsp; Muutokset ruokalistaan mahdollisia <span id="err"></span></div>
</div>

<script type="text/javascript">
// >>> Vaihda tähän oma Workerisi osoite (http://, ei https) <<<
var API_URL = "http://ruoka-proxy.mankolatvt.workers.dev";

var NAMES = ["Maanantai","Tiistai","Keskiviikko","Torstai","Perjantai"];
var NO_FOOD = "Ei ruokalistaa";

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function sizeClass(t){ var n=t.length; return n<=70?"f1":(n<=120?"f2":(n<=180?"f3":"f4")); }
function two(n){ return n<10 ? "0"+n : ""+n; }

function render(data){
  var byIdx = {}, i, html = "", d;
  for (i=0;i<data.days.length;i++){ byIdx[data.days[i].i] = data.days[i]; }
  for (i=0;i<5;i++){
    d = byIdx[i];
    var food = d && d.food ? d.food : "";
    html += '<div class="row" data-day="'+(i+1)+'"><div class="day"><div class="dname">'+NAMES[i]+'</div>'
      + '<div class="ddate">'+(d ? esc(d.d) : "&nbsp;")+'</div><span class="pill">TÄNÄÄN</span></div>'
      + (food ? '<div class="food '+sizeClass(food)+'">'+esc(food)+'</div>'
              : '<div class="food f2 none">'+NO_FOOD+'</div>')
      + '</div>';
  }
  document.getElementById("rows").innerHTML = html;
  document.getElementById("wk").innerHTML = "Viikko " + data.week;
  document.getElementById("range").innerHTML = esc(data.range);
  var n = new Date();
  document.getElementById("upd").innerHTML = "Päivitetty " + n.getDate()+"."+(n.getMonth()+1)+". klo "+two(n.getHours())+"."+two(n.getMinutes());
  document.getElementById("err").innerHTML = "";
  markToday();
}

function markToday(){
  var wd = new Date().getDay();
  var rows = document.getElementById("rows").getElementsByTagName("div");
  var i, el, d, cls;
  for (i=0;i<rows.length;i++){
    el = rows[i]; d = el.getAttribute("data-day");
    if (!d) { continue; }
    d = parseInt(d,10); cls = "row";
    if (wd>=1 && wd<=5){ if (d===wd) { cls += " today"; } else if (d<wd) { cls += " past"; } }
    el.className = cls;
  }
}

function load(){
  var x = new XMLHttpRequest();
  x.onreadystatechange = function(){
    if (x.readyState !== 4) { return; }
    var data = null;
    try { data = JSON.parse(x.responseText); } catch(e) {}
    if (x.status === 200 && data && data.days){ render(data); }
    else {
      document.getElementById("err").innerHTML = "· Yhteysvirhe (" + x.status + "), yritetään uudelleen";
      setTimeout(load, 30000);
    }
  };
  x.open("GET", API_URL + (API_URL.indexOf("?")<0 ? "?" : "&") + "t=" + new Date().getTime(), true);
  x.send(null);
}
load();                       // haetaan joka kerta kun sivu avataan / ladataan uudelleen
setInterval(markToday, 60000);
</script>
</body>
</html>
