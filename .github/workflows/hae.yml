name: Hae Mankolan ruokalista

on:
  schedule:
    - cron: "5 4,8,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hae:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hae ruokalista
        run: python hae_ruokalista.py
      - name: Tallenna muutokset
        run: |
          git config user.name "ruokalista-botti"
          git config user.email "ruokalista-botti@users.noreply.github.com"
          git add menu.json raw.json
          if ! git diff --cached --quiet; then
            git commit -m "Päivitetty ruokalista"
            git push
          fi
